name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v2
      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py
      - name: Commit & Push
        run: |
          git config user.name gzileni
          git config user.email giuseppe.zileni@gmail.com
          git add -A .
          git diff --cached --quiet || git commit -m "generated"
          git push
